# Корпус регрессионных тестов парсера maxbot.
# Каждый кейс: input — реальное сообщение, expected — ключевые поля JSON
# которые должны попасть в результат парсера.
#
# Сверка мягкая: проверяем что type/основные поля совпадают.
# Если в expected поле = null — значит проверяем что в реальном результате
# поля либо нет, либо оно null.
#
# Источник: MANAGER_GUIDE.md + промпт _parse_blok_plan_claude.

# ═══════════════════════════════════════════════════════════════════
# I. РЕЙСЫ (отгрузка клиенту, своё производство)
# ═══════════════════════════════════════════════════════════════════

- name: "01. простой рейс — автоопределение водителя по машине"
  input: "Выполнен рейс для 135 от 14.05 КРД → ИП Шубина (п. Знаменский, СНТ Биолог-Юг, Дубковая 9), 20(3-0) - 15 подд по 75 шт"
  expected:
    - type: trip
      date: "14.05.2026"
      truck: "у135рх 193"
      driver: "Кораблев М.Н."
      from_location: "КРД"
      client_contains: "Шубина"
      product_contains: "20(3-0)"
      pallets: 15
      qty_per_pallet: 75
      source: "производство"

- name: "02. рейс машина 319 (Адлейба)"
  input: "Отгрузил 319 рейс 15.05 КРД → ИП Деревянко, 12(2-0) 10 подд по 120 шт"
  expected:
    - type: trip
      date: "15.05.2026"
      truck: "р319ок 123"
      driver: "Адлейба А.Ю."
      from_location: "КРД"
      product_contains: "12(2-0)"
      pallets: 10

- name: "03. рейс машина 638 (Кислицин)"
  input: "Рейс для 638 от 16.05 Карьер → ИП Горячкина 9(2-0) 8 подд по 150 шт"
  expected:
    - type: trip
      date: "16.05.2026"
      truck: "р638хн 123"
      driver: "Кислицин А.С."
      from_location: "Карьер"
      pallets: 8

# ═══════════════════════════════════════════════════════════════════
# II. ЗАКУПКИ
# ═══════════════════════════════════════════════════════════════════

- name: "04. простая закупка — один блок"
  input: "Закупка от 14.05 для 135 от ИП Евсеев, Великовечное, 20(3-0) - 15 подд по 75 шт, цена 39 руб, доставка 16000 руб, на ИП Горячкина (Краснодар, пос. Южный, Кожедуба 30), цена продажи 61 руб"
  expected:
    - type: trip
      source: "закуп"
      date: "14.05.2026"
      truck: "у135рх 193"
      supplier: "ИП Евсеев"
      from_location_contains: "Великовечное"
      product_contains: "20(3-0)"
      pallets: 15
      qty_per_pallet: 75
      price_buy: 39
      delivery_in: 16000
      client_contains: "Горячкина"
      price_sell: 61

- name: "05. закупка — два блока в иерархии"
  input: |
    Закупка от 13.05 для 135 от ИП Евсеев, Великовечное:
    20(3-0) - 9 подд по 90 шт, цена 39 руб
    + 12(2-0) - 4 подд по 120 шт, цена 30 руб
    Доставка 16000 руб, на ИП Горячкина, цена продажи: 20(3-0) - 61 руб, 12(2-0) - 48 руб
  expected:
    - type: trip
      source: "закуп"
      date: "13.05.2026"
      supplier: "ИП Евсеев"
      delivery_in: 16000
      client_contains: "Горячкина"
      products_detail_count: 2

- name: "06. сборный рейс — две выгрузки разным клиентам"
  input: |
    Выполненный рейс от 19.05 для 135-го.
    Закупка 19.05 от ИП Евсеев, Великовечное, 12(2-0) - 8 подд по 120 шт/подд цена 32 руб + 12(2-0) - 1 подд по 120 шт/подд цена 30 руб, доставка 10200 руб на ИП Шубина цена продажи 48 руб
    Закупка 19.05 от ИП Евсеев, Великовечное, 20(3-0) - 2 подд по 75 шт/подд цена 39 руб + 12(2-0) - 4 подд по 120 шт/подд цена 30 руб, доставка 6800 руб на ИП Горячкина цена продажи 20(3-0) - 61 руб, 12(2-0) - 48 руб
  expected:
    - type: trip
      source: "закуп"
      date: "19.05.2026"
      truck: "у135рх 193"
      supplier: "ИП Евсеев"
      deliveries_count: 2

# ═══════════════════════════════════════════════════════════════════
# III. ПЕРЕМЕЩЕНИЕ ПОДДОНОВ
# ═══════════════════════════════════════════════════════════════════

- name: "07. перемещение пустых поддонов"
  input: "Перемещение 200 поддонов с Тихорецкой на Карьер для 135 от 19.05"
  expected:
    - type: pallet_transfer
      date: "19.05.2026"
      truck: "у135рх 193"
      from_location_contains: "Тихорецк"
      to_location_contains: "Карьер"
      pallets: 200

# ═══════════════════════════════════════════════════════════════════
# IV. ВОЗВРАТ ПОДДОНОВ
# ═══════════════════════════════════════════════════════════════════

- name: "08. возврат поддонов от клиента"
  input: "Возврат поддонов от ИП Шубина 20 подд от 18.05, объект Знаменский, на 135"
  expected:
    - type: return
      date: "18.05.2026"
      truck: "у135рх 193"
      client_contains: "Шубина"
      return_pallets: 20

# ═══════════════════════════════════════════════════════════════════
# V. ОПЛАТЫ
# ═══════════════════════════════════════════════════════════════════

- name: "09. оплата наличные"
  input: "Оплатил ИП Шубина 50000 руб наличные за блоки"
  expected:
    - type: payment_info
      client_contains: "Шубина"
      payment_type: "нал"
      payment_amount: 50000

- name: "10. оплата безнал — ЧАСТНИКИ + контактное лицо"
  input: "Оплатила ЧАСТНИКИ клиент Шубина 176550 руб на ИП от 14.05"
  expected:
    - type: payment_info
      client: "ЧАСТНИКИ"
      payment_amount: 176550
      payment_method: "ИП"

- name: "11. оплата организация на ИП"
  input: "Оплатила организация МеликсетянТ на ИП 120000 руб"
  expected:
    - type: payment_info
      client_contains: "Меликсетян"
      payment_type: "безнал"
      payment_amount: 120000
      payment_method: "ИП"

# ═══════════════════════════════════════════════════════════════════
# VI. ИЗМЕНЕНИЕ ЦЕНЫ
# ═══════════════════════════════════════════════════════════════════

- name: "12. изменение цены — с датой начала действия"
  input: "Надо изменить цену у ИП Шубина на Блок 20(3-0) с дост. с 24.05.26 на 61 руб"
  expected:
    - type: price
      client_contains: "Шубина"
      price_new: 61
      price_date_from: "24.05.2026"

- name: "13. добавить цену клиенту ЧАСТНИКИ"
  input: "Добавить цену ЧАСТНИКИ, ИП Шубина, Блок 12(2-0), 48 руб"
  expected:
    - type: price
      client: "ЧАСТНИКИ"
      price_contact_contains: "Шубина"
      price_new: 48

# ═══════════════════════════════════════════════════════════════════
# VII. ПРАВКИ (correction)
# ═══════════════════════════════════════════════════════════════════

- name: "14. правка закупки — по номеру"
  input: "Поправь закупку #2 от 13.05 — поставщик ИП Евсеев, цена закупки 40"
  expected:
    - type: correction
      target_table: "Закупки"
      target_num: 2
      target_date: "13.05.2026"
      updates_has: ["поставщик", "цена_закупки"]

- name: "15. правка рейса — водитель"
  input: "Исправь рейс #7 от 14.05 — водитель не Кораблев, а Адлейба"
  expected:
    - type: correction
      target_table: "Рейсы"
      target_num: 7
      updates_has: ["водитель"]

- name: "16. правка по дате+клиенту (без номера)"
  input: "Корректировка закупки 14.05 ИП Горячкина — поставщик Великовечное, 20(3-0), 15 поддонов 1125 шт, цена 41, доставка 15000, цена продажи 60"
  expected:
    - type: correction
      target_table: "Закупки"
      target_date: "14.05.2026"
      target_client_contains: "Горячкина"

- name: "17. дополнить уже занесённую закупку"
  input: "Дополни закупку #1 ценой продажи 55 руб/шт и датой продажи 14.05"
  expected:
    - type: correction
      target_table: "Закупки"
      target_num: 1
      updates_has: ["цена_продажи"]

# ═══════════════════════════════════════════════════════════════════
# VIII. КЛИЕНТЫ И ОБЪЕКТЫ
# ═══════════════════════════════════════════════════════════════════

- name: "18. добавить новый объект (несколько литер)"
  input: "Надо добавить в КонтинентИнвест в Объекты Литер 7 и Литер 11"
  expected:
    - type: object_add
      client_contains: "КонтинентИнвест"
      object_name_contains: "Литер 7"
    - type: object_add
      client_contains: "КонтинентИнвест"
      object_name_contains: "Литер 11"

- name: "19. добавить нового клиента"
  input: "Клиент: ИП Горячкина  Оплата: нал"
  expected:
    - type: client_add
      client_contains: "Горячкина"

# ═══════════════════════════════════════════════════════════════════
# IX. EDGE CASES — то что должно НЕ обрабатываться или обрабатываться особо
# ═══════════════════════════════════════════════════════════════════

- name: "20. план на будущее → должен быть проигнорирован (пустой ответ)"
  input: "План на завтра 19.05: 135-й поедет утром в КРД, потом на Шубину"
  expected: []

- name: "21. шум — обычный болтливый текст без операций"
  input: "Привет, ребята! Как дела на производстве? Готовы к понедельнику?"
  expected: []

- name: "22. неоднозначное «исправь» = НОВОЕ перемещение, а не правка"
  input: "Исправь рейсы, перемещение поддонов 200 пд с Тихорецкой на Карьер для 135 от 20.05"
  expected:
    - type: pallet_transfer
      date: "20.05.2026"
      pallets: 200

- name: "23. несколько правок в одном сообщении"
  input: |
    Поправь закупку #1 от 12.05: поставщик ИП Евсеев, цена 30
    Поправь закупку #2 от 13.05: цена закупки 39, доставка 16000
    Поправь закупку #3 от 14.05: цена закупки 39, цена продажи 61
  expected:
    - type: correction
      target_num: 1
    - type: correction
      target_num: 2
    - type: correction
      target_num: 3
